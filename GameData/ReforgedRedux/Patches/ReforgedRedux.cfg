// Reforged Materials Redux - the only ModuleManager patch in the mod.
//
// Adds ModuleReforged to every part that is actually loaded. Because
// @PART[*] only ever matches installed parts, nothing is patched (and
// nothing is logged) for mods that are not present. The module is inert
// until the player paints something, so parts keep their true stock
// appearance, icons included.
//
// :FOR registers the mod name so other mods can use :NEEDS[ReforgedRedux].
@PART[*]:HAS[!MODULE[ModuleReforged],!MODULE[KerbalEVA]]:FOR[ReforgedRedux]
{
	MODULE
	{
		name = ModuleReforged
	}
}
